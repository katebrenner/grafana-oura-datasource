services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    volumes:
      # Override base: use this repo's dist and provisioning (base uses ../ which points outside the repo)
      - ./dist:/var/lib/grafana/plugins/katebrenner-oura-datasource
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/katebrenner-oura-datasource
